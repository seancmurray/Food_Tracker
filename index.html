<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUEL - Food Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">FUEL</a>
            <div class="nav-links">
                <a href="#add">ADD</a>
                <a href="#entries">ENTRIES</a>
                <a href="#stats">STATS</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-background"></div>
        <div class="hero-background"></div>
        <div class="hero-content">
            <h1 class="hero-title">
                <span class="hero-word">TRACK.</span><br>
                <span class="hero-word">FUEL.</span><br>
                <span class="hero-word">PERFORM.</span>
            </h1>
            <p class="hero-subtitle">Your nutrition journey starts here</p>
        </div>
        <div class="hero-dots" role="tablist" aria-label="Hero background selector"></div>
    </section>

    <div class="main-container">
        <!-- Add Food Section -->
        <section id="add" class="section add-section">
            <div class="section-header">
                <h2 class="section-title">ADD MEAL</h2>
            </div>
            
            <form id="food-form" class="food-form">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="date">DATE</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-field">
                        <label for="meal-type">MEAL TYPE</label>
                        <select id="meal-type" required>
                            <option value="">SELECT</option>
                            <option value="Breakfast">BREAKFAST</option>
                            <option value="Lunch">LUNCH</option>
                            <option value="Dinner">DINNER</option>
                            <option value="Snack">SNACK</option>
                        </select>
                    </div>
                </div>

                <div class="form-field full">
                    <label for="food-name">FOOD NAME</label>
                    <div class="search-group">
                        <input type="text" id="food-name" placeholder="Search or enter food name" required>
                        <button type="button" id="search-btn" class="btn-icon">Search</button>
                        <button type="button" id="my-foods-btn" class="btn-icon">My Foods</button>
                    </div>
                    <button type="button" id="toggle-details-btn" class="link-btn">▼ SHOW DETAILS</button>
                </div>

                <div id="food-details-section" class="details-section collapsed">
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="num-servings">SERVINGS</label>
                            <input type="number" id="num-servings" min="0.1" step="0.1" value="1" placeholder="1">
                        </div>
                        <div class="form-field">
                            <label for="serving-size">SIZE</label>
                            <input type="text" id="serving-size" placeholder="e.g., 1 cup" required>
                        </div>
                        <div class="form-field">
                            <label for="grams">GRAMS</label>
                            <input type="number" id="grams" min="0" step="0.1" placeholder="100">
                        </div>
                    </div>

                    <div class="form-grid macros-grid">
                        <div class="form-field">
                            <label for="calories">CALORIES</label>
                            <input type="number" id="calories" min="0" placeholder="0" required>
                        </div>
                        <div class="form-field">
                            <label for="protein">PROTEIN (G)</label>
                            <input type="number" id="protein" min="0" step="0.1" placeholder="0" required>
                        </div>
                        <div class="form-field">
                            <label for="carbs">CARBS (G)</label>
                            <input type="number" id="carbs" min="0" step="0.1" placeholder="0" required>
                        </div>
                        <div class="form-field">
                            <label for="fat">FAT (G)</label>
                            <input type="number" id="fat" min="0" step="0.1" placeholder="0" required>
                        </div>
                        <div class="form-field">
                            <label for="sodium">SODIUM (MG)</label>
                            <input type="number" id="sodium" min="0" step="1" placeholder="0" required>
                        </div>
                    </div>
                </div>

                <div class="form-field checkbox-field">
                    <label class="checkbox-label">
                        <input type="checkbox" id="save-custom-food">
                        <span>SAVE AS CUSTOM FOOD</span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">ADD FOOD</button>
                    <button type="button" id="clear-form-btn" class="btn-secondary">CLEAR</button>
                    <button type="button" id="seed-data-btn" class="btn-seed">✨ SEED 7 DAYS</button>
                </div>
            </form>
        </section>

        <!-- Filter Section -->
        <section class="filter-bar">
            <div class="filter-controls">
                <div class="filter-item">
                    <label for="filter-date">FILTER BY DATE</label>
                    <input type="date" id="filter-date">
                </div>
                <button id="clear-filter" class="btn-text">SHOW ALL</button>
            </div>
            
            <div class="data-controls">
                <button id="export-data-btn" class="btn-export">↑ EXPORT</button>
                <button id="import-data-btn" class="btn-import">↓ IMPORT</button>
                <input type="file" id="import-file-input" accept=".json" style="display: none;">
            </div>
        </section>

        <!-- Entries Section -->
        <section id="entries" class="section entries-section">
            <div class="section-header">
                <h2 class="section-title">YOUR ENTRIES</h2>
            </div>
            <div id="entries-container"></div>
        </section>

        <!-- Stats Section -->
        <section id="stats" class="section stats-section">
            <div class="section-header">
                <h2 class="section-title">YOUR STATS</h2>
            </div>
            
            <div class="stats-grid">
                <!-- Daily Calories Chart -->
                <div class="stat-card">
                    <h3 class="stat-card-title">DAILY CALORIES</h3>
                    <div class="chart-container">
                        <canvas id="calories-chart"></canvas>
                    </div>
                </div>

                <!-- Macros Breakdown Chart -->
                <div class="stat-card">
                    <h3 class="stat-card-title">MACROS BREAKDOWN (TODAY)</h3>
                    <div class="chart-container">
                        <canvas id="macros-chart"></canvas>
                    </div>
                </div>

                <!-- Weekly Overview -->
                <div class="stat-card full-width">
                    <h3 class="stat-card-title">7-DAY OVERVIEW</h3>
                    <div class="chart-container">
                        <canvas id="weekly-chart"></canvas>
                    </div>
                </div>

                <!-- Quick Stats Cards -->
                <div class="quick-stats">
                    <div class="quick-stat-item">
                        <div class="quick-stat-value" id="avg-calories">—</div>
                        <div class="quick-stat-label">AVG DAILY CALORIES</div>
                    </div>
                    <div class="quick-stat-item">
                        <div class="quick-stat-value" id="total-protein">—</div>
                        <div class="quick-stat-label">TOTAL PROTEIN (7D)</div>
                    </div>
                    <div class="quick-stat-item">
                        <div class="quick-stat-value" id="total-entries">—</div>
                        <div class="quick-stat-label">TOTAL ENTRIES</div>
                    </div>
                    <div class="quick-stat-item">
                        <div class="quick-stat-value" id="best-day">—</div>
                        <div class="quick-stat-label">MOST ENERGY INTAKE</div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Search Results Modal -->
    <div id="search-modal" class="modal">
        <div class="modal-wrapper">
            <div class="modal-container">
                <div class="modal-header">
                    <h3 id="modal-title">SELECT NUTRITION INFO</h3>
                    <button class="close-modal" id="close-modal">✕</button>
                </div>
                <div class="modal-body">
                    <div id="custom-foods-search" class="modal-search is-hidden">
                        <label for="custom-foods-search-input">SEARCH MY FOODS</label>
                        <input type="text" id="custom-foods-search-input" placeholder="Search custom foods">
                    </div>
                    <div id="search-results"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Food Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-wrapper">
            <div class="modal-container">
                <div class="modal-header">
                    <h3>EDIT ENTRY</h3>
                    <button class="close-modal" id="close-edit-modal">✕</button>
                </div>
                <div class="modal-body">
                    <form id="edit-form">
                        <div class="form-grid">
                            <div class="form-field">
                                <label for="edit-date">DATE</label>
                                <input type="date" id="edit-date" required>
                            </div>
                            <div class="form-field">
                                <label for="edit-meal-type">MEAL TYPE</label>
                                <select id="edit-meal-type" required>
                                    <option value="Breakfast">BREAKFAST</option>
                                    <option value="Lunch">LUNCH</option>
                                    <option value="Dinner">DINNER</option>
                                    <option value="Snack">SNACK</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-field full">
                            <label for="edit-food-name">FOOD NAME</label>
                            <input type="text" id="edit-food-name" required>
                        </div>

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="edit-num-servings">SERVINGS</label>
                                <input type="number" id="edit-num-servings" min="0.1" step="0.1" value="1">
                            </div>
                            <div class="form-field">
                                <label for="edit-serving-size">SIZE</label>
                                <input type="text" id="edit-serving-size" required>
                            </div>
                            <div class="form-field">
                                <label for="edit-grams">GRAMS</label>
                                <input type="number" id="edit-grams" min="0" step="0.1">
                            </div>
                        </div>

                        <div class="form-grid macros-grid">
                            <div class="form-field">
                                <label for="edit-calories">CALORIES</label>
                                <input type="number" id="edit-calories" min="0" required>
                            </div>
                            <div class="form-field">
                                <label for="edit-protein">PROTEIN (G)</label>
                                <input type="number" id="edit-protein" min="0" step="0.1" required>
                            </div>
                            <div class="form-field">
                                <label for="edit-carbs">CARBS (G)</label>
                                <input type="number" id="edit-carbs" min="0" step="0.1" required>
                            </div>
                            <div class="form-field">
                                <label for="edit-fat">FAT (G)</label>
                                <input type="number" id="edit-fat" min="0" step="0.1" required>
                            </div>
                            <div class="form-field">
                                <label for="edit-sodium">SODIUM (MG)</label>
                                <input type="number" id="edit-sodium" min="0" step="1" required>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-primary">SAVE CHANGES</button>
                            <button type="button" class="btn-secondary" id="cancel-edit">CANCEL</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
