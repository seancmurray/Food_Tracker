<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ Food Tracker</h1>
            <p>Track your daily nutrition and meals</p>
        </header>

        <div class="input-section">
            <h2>Add Food Entry</h2>
            <form id="food-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date:</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="meal-type">Meal Type:</label>
                        <select id="meal-type" required>
                            <option value="">Select Meal</option>
                            <option value="Breakfast">Breakfast</option>
                            <option value="Lunch">Lunch</option>
                            <option value="Dinner">Dinner</option>
                            <option value="Snack">Snack</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="food-name">Food Name:</label>
                        <input type="text" id="food-name" placeholder="e.g., Grilled Chicken" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="calories">Calories:</label>
                        <input type="number" id="calories" min="0" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label for="protein">Protein (g):</label>
                        <input type="number" id="protein" min="0" step="0.1" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label for="carbs">Carbs (g):</label>
                        <input type="number" id="carbs" min="0" step="0.1" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label for="fat">Fat (g):</label>
                        <input type="number" id="fat" min="0" step="0.1" placeholder="0" required>
                    </div>
                </div>

                <button type="submit" class="btn-add">Add Food</button>
            </form>
        </div>

        <div class="filter-section">
            <label for="filter-date">Filter by Date:</label>
            <input type="date" id="filter-date">
            <button id="clear-filter" class="btn-secondary">Show All</button>
        </div>

        <div class="entries-section">
            <h2>Food Entries</h2>
            <div id="entries-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
